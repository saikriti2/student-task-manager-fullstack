<!DOCTYPE html>

<html>

<head>

<title>Login</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<h1>Login</h1>

<input
id="email"
placeholder="Email">

<br><br>

<input
id="password"
type="password"
placeholder="Password">

<br><br>

<button onclick="login()">

Login

</button>


<script>

async function login(){

let email=

document.getElementById(
"email"
).value;

let password=

document.getElementById(
"password"
).value;


let response=

await fetch(

"https://student-task-manager-fullstack-api.onrender.com/login",

{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

email,
password

})

}

);

let data=

await response.json();


if(data.token){

localStorage.setItem(

"token",
data.token

);

alert(
"Login successful"
);

window.location=

"dashboard.html";

}

else{

alert(

data.message

);

}

}

</script>

</body>

</html>
