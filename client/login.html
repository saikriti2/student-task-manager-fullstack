<!DOCTYPE html>
<html>

<head>

<title>Login</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<h1>Login</h1>

<input
type="email"
id="email"
placeholder="Email"
>

<input
type="password"
id="password"
placeholder="Password"
>

<button onclick="login()">

Login

</button>

</div>

<script>

async function login(){

let response=await fetch(
"https://student-task-manager-fullstack-api.onrender.com/login",
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

email:
document.getElementById("email").value,

password:
document.getElementById("password").value

})

}

);

let data=await response.json();

localStorage.setItem(
"token",
data.token
);

window.location=
"dashboard.html";

}

</script>

</body>
</html>
