<!DOCTYPE html>
<html>

<body>

<h1>Signup</h1>

<input
id="username"
placeholder="Username">

<input
id="email"
placeholder="Email">

<input
id="password"
type="password"
placeholder="Password">

<button onclick="signup()">

Signup

</button>

<script>

async function signup(){

await fetch(
"https://student-task-manager-fullstack-api.onrender.com/signup",
{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

username:
username.value,

email:
email.value,

password:
password.value

})

}

);

alert(
"Signup successful"
);

window.location=
"login.html";

}

</script>

</body>
</html>
