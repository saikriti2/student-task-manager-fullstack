<!DOCTYPE html>

<html>

<head>

<title>Signup</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<h1>Signup</h1>

<input
id="username"
placeholder="Username">

<br><br>

<input
id="email"
placeholder="Email">

<br><br>

<input
id="password"
type="password"
placeholder="Password">

<br><br>

<button onclick="signup()">

Signup

</button>


<script>

async function signup(){

let username=

document.getElementById(
"username"
).value;

let email=

document.getElementById(
"email"
).value;

let password=

document.getElementById(
"password"
).value;


let response=

await fetch(

"https://student-task-manager-fullstack-api.onrender.com/signup",

{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

username,
email,
password

})

}

);

let data=

await response.json();

alert(
data.message
);

if(

data.message==="Signup successful"

){

window.location=

"login.html";

}

}

</script>

</body>

</html>
